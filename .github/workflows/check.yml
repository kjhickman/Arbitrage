name: Check

on:
  workflow_call:
    inputs:
      lua:
        type: boolean
        default: false
      companion:
        type: boolean
        default: false
      worker:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lua:
    name: Check Arbitrage Lua
    if: inputs.lua
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release inputs
        run: sh ./scripts/release-affected --test

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: for test in tests/*_test.lua; do lua5.1 "$test"; done

      - name: Check formatting
        run: |
          curl --fail --location --output /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -q /tmp/stylua.zip -d /tmp/stylua
          /tmp/stylua/stylua --check .

      - name: Run diagnostics
        run: |
          ./scripts/install-wowlua-ls
          .tools/wowlua_ls check . --severity hint

      - name: Build release archive
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d
          pandoc: false

  companion:
    name: Companion (${{ matrix.os }})
    if: inputs.companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-companion --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --package arbitrage-companion --all-targets --all-features

  worker:
    name: Worker
    if: inputs.worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-shared-key: worker
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-worker --target wasm32-unknown-unknown --all-targets --all-features

      - name: Install worker-build
        run: cargo install --locked worker-build --version 0.8.6

      - name: Build Worker
        working-directory: companion/worker
        run: worker-build --release
