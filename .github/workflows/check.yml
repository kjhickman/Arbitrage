name: Check

on:
  workflow_call:
    inputs:
      lua:
        type: boolean
        default: false
      companion:
        type: boolean
        default: false
      worker:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lua:
    name: Check Arbitrage Lua
    if: inputs.lua
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Lua 5.1.5
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.1.5"

      - name: Run tests
        run: for test in tests/*_test.lua; do lua "$test"; done

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        with:
          token: ${{ github.token }}
          version: "2.5.2"
          args: --check .

      - name: Run Luacheck
        uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0

      - name: Build release archive
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d
          pandoc: false

  companion:
    name: Companion (${{ matrix.os }})
    if: inputs.companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-companion --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --package arbitrage-companion --all-targets --all-features

  worker:
    name: Worker
    if: inputs.worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-shared-key: worker
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-worker --target wasm32-unknown-unknown --all-targets --all-features

      - name: Install worker-build
        run: cargo install --locked worker-build --version 0.8.6

      - name: Build Worker
        working-directory: companion/worker
        run: worker-build --release
