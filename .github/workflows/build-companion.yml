name: Build Companion

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            binary: arbitrage-companion.exe

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: companion

      - name: Build release binary
        run: cargo build --locked --release --package arbitrage-companion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-companion-${{ matrix.name }}
          path: companion/target/release/${{ matrix.binary }}
          if-no-files-found: error
