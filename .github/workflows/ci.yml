name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lua: ${{ steps.diff.outputs.checks_lua }}
      companion: ${{ steps.diff.outputs.checks_companion }}
      worker: ${{ steps.diff.outputs.checks_worker }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  lua:
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    uses: ./.github/workflows/check.yml
    with:
      lua: true

  companion:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    uses: ./.github/workflows/check.yml
    with:
      companion: true

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/check.yml
    with:
      worker: true

  deploy-staging:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: staging
    secrets: inherit
