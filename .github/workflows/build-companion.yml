name: Build Companion

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the build, e.g. v1.2.3
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: Arbitrage-Companion-windows-x86_64-setup.exe
          - name: macos-aarch64
            os: macos-latest
            artifact: Arbitrage-Companion-macos-aarch64.dmg

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-companion --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --package arbitrage-companion --all-targets --all-features

      - name: Set version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak "s/^version = \".*\"$/version = \"${VERSION#v}\"/" Cargo.toml
          rm Cargo.toml.bak
          cargo update --workspace

      - name: Build release binary
        run: cargo build --locked --release --package arbitrage-companion

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1

      - name: Package app (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: companion/target/release/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
