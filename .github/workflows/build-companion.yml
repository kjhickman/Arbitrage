name: Build Companion

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: arbitrage-companion.exe
            archive: true
          - name: macos-aarch64
            os: macos-latest
            artifact: Arbitrage-Companion-macos-aarch64.dmg
            archive: false

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion

      - name: Build release binary
        run: cargo build --locked --release --package arbitrage-companion

      - name: Package app
        if: runner.os == 'macOS'
        run: scripts/package-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arbitrage-companion-${{ matrix.name }}
          path: companion/target/release/${{ matrix.artifact }}
          archive: ${{ matrix.archive }}
          if-no-files-found: error
