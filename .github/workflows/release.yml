name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      addon: ${{ steps.base.outputs.sha == '' || steps.diff.outputs.release_addon == 'true' }}
      companion: ${{ steps.base.outputs.sha == '' || steps.diff.outputs.release_companion == 'true' }}
      worker: ${{ steps.base.outputs.sha == '' || steps.diff.outputs.release_worker == 'true' }}
      addon_notes: ${{ steps.notes.outputs.addon }}
      github_notes: ${{ steps.notes.outputs.github }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: base
        run: |
          set -euo pipefail
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null)"; then
            echo "Comparing $previous to $GITHUB_REF_NAME"
            echo "sha=$(git rev-parse "$previous^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "No previous version tag; treating the addon, companion, and worker as changed"
          fi

      - id: diff
        if: steps.base.outputs.sha != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

      - id: notes
        if: steps.base.outputs.sha == '' || steps.diff.outputs.release_addon == 'true' || steps.diff.outputs.release_companion == 'true'
        env:
          NEED_ADDON: ${{ steps.base.outputs.sha == '' || steps.diff.outputs.release_addon == 'true' }}
        run: |
          set -euo pipefail
          github_notes="$(scripts/changelog "$GITHUB_REF_NAME" github)"
          delim="EOF_$(uuidgen)"
          {
            echo "github<<$delim"
            printf '%s\n' "$github_notes"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          if [ "$NEED_ADDON" = "true" ]; then
            addon_notes="$(scripts/changelog "$GITHUB_REF_NAME" addon)"
            {
              echo "addon<<$delim"
              printf '%s\n' "$addon_notes"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          fi

  lua:
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    uses: ./.github/workflows/check.yml
    with:
      lua: true

  release:
    needs: [changes, lua]
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write addon changelog
        env:
          ADDON_NOTES: ${{ needs.changes.outputs.addon_notes }}
        run: printf '%s\n' "$ADDON_NOTES" > CHANGELOG.md

      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_NOTES: ${{ needs.changes.outputs.github_notes }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$GITHUB_NOTES"

  companion:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    uses: ./.github/workflows/build-companion.yml
    with:
      version: ${{ github.ref_name }}

  publish-companion:
    needs: [changes, release, companion]
    if: ${{ !cancelled() && needs.companion.result == 'success' && (needs.changes.outputs.addon != 'true' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Open a release for the companion
        if: needs.changes.outputs.addon != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_NOTES: ${{ needs.changes.outputs.github_notes }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$GITHUB_NOTES" --verify-tag

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
    secrets: inherit
