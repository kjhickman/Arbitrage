name: Deploy Worker

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      BATTLE_NET_CLIENT_ID:
        description: Read from the deploy environment
        required: false
      BATTLE_NET_CLIENT_SECRET:
        description: Read from the deploy environment
        required: false
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.environment }}-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      BATTLE_NET_CLIENT_ID: ${{ secrets.BATTLE_NET_CLIENT_ID }}
      BATTLE_NET_CLIENT_SECRET: ${{ secrets.BATTLE_NET_CLIENT_SECRET }}
      WRANGLER_ENV: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: companion/worker
    steps:
      # An empty value here would overwrite the live Worker secret or var.
      - name: Require deploy configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_ORIGIN BATTLE_NET_CLIENT_ID BATTLE_NET_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for the ${WRANGLER_ENV} environment"
              exit 1
            fi
          done
        working-directory: .

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: companion
          cache-shared-key: worker
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: cargo clippy --locked --package arbitrage-worker --target wasm32-unknown-unknown --all-targets --all-features

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Deploy to Cloudflare Workers
        run: |
          jq -n --arg id "$BATTLE_NET_CLIENT_ID" --arg secret "$BATTLE_NET_CLIENT_SECRET" \
            '{BATTLE_NET_CLIENT_ID: $id, BATTLE_NET_CLIENT_SECRET: $secret}' > "$RUNNER_TEMP/worker-secrets.json"
          NO_COLOR=1 npx --yes wrangler@4.137.0 deploy --env "$WRANGLER_ENV" --strict \
            --var "PUBLIC_ORIGIN:$PUBLIC_ORIGIN" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
