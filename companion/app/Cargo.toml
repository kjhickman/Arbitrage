[package]
name = "arbitrage-companion"
description = "System tray companion for the Arbitrage World of Warcraft addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arbitrage-shared.workspace = true
base64.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
getrandom = { version = "0.2.16", default-features = false }
notify.workspace = true
open = "5.3.2"
rfd = { version = "0.17.2", default-features = false }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
tray-icon.workspace = true
ureq = { workspace = true, features = ["json", "rustls"] }
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2-core-foundation.workspace = true
png = "0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
winreg = "0.55.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true
