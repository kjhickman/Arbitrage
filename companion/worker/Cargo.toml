[package]
name = "arbitrage-worker"
description = "Cloudflare Worker for Arbitrage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arbitrage-shared.workspace = true
base64.workspace = true
getrandom = { version = "0.2.16", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
wasm-bindgen = "0.2.105"
worker.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.16", default-features = false, features = ["js"] }

[lints]
workspace = true
