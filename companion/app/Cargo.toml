[package]
name = "arbitrage-companion"
description = "System tray companion for the Arbitrage World of Warcraft addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arbitrage-shared.workspace = true
base64.workspace = true
getrandom = { version = "0.2.16", default-features = false }
notify.workspace = true
open = "5.3.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tray-icon.workspace = true
ureq = { workspace = true, features = ["json"] }
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2-core-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[lints]
workspace = true
